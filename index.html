<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Questlog</title>
<meta name="theme-color" content="#11131c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Questlog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout idea: a pinned character card on top, one thumb-reach column of quests below, tabs at the bottom. */
:root{
  color-scheme:dark;
  --bg:#11131c; --panel:#1b1e2b; --line:#2d3144; --text:#f1f0ea; --muted:#a3a6b8;
  --xp:#ffb53d; --xp2:#ff7a45; --good:#58d6a4; --blue:#7fa8ff;
  --top:env(safe-area-inset-top,0px);
  --font:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (display-mode:standalone) and (orientation:portrait){:root{--top:max(env(safe-area-inset-top,0px),50px)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 var(--font);overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);height:100%;max-width:560px;margin:auto;display:flex;flex-direction:column}
header{padding:calc(var(--top) + 14px) 16px 14px;background:var(--panel);border-bottom:1px solid var(--line);border-radius:0 0 22px 22px}
.top{display:flex;align-items:center;gap:12px}
.lvl{width:54px;height:54px;flex:none;border-radius:16px;background:linear-gradient(145deg,var(--xp),var(--xp2));color:#22130a;display:grid;place-content:center;text-align:center;font-weight:800;font-size:23px;line-height:1}
.lvl small{display:block;font-size:9px;letter-spacing:.08em;margin-bottom:2px}
.who{flex:1;min-width:0}
.who b{display:block;font-size:19px}
.who span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:13px;margin-top:12px;border-radius:9px;background:#0c0e15;overflow:hidden}
.bar i{display:block;height:100%;min-width:6px;border-radius:9px;background:linear-gradient(90deg,var(--xp2),var(--xp));transition:width .45s cubic-bezier(.2,.9,.3,1.2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.stat{background:#141722;border-radius:12px;padding:7px 8px;min-width:0}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
h2{font-size:14px;margin:6px 0 0;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:58px}
.row.done{opacity:.62}.row.done .name{text-decoration:line-through}
.check{width:32px;height:32px;flex:none;border-radius:50%;border:2px solid var(--muted);display:grid;place-content:center;color:#10231b;font-weight:900}
.done .check{background:var(--good);border-color:var(--good)}
.info{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere}
.name{display:block}
.meta{font-size:12.5px;color:var(--muted)}
.x{width:36px;height:36px;flex:none;color:var(--muted);font-size:20px}
.btn{min-height:46px;padding:0 16px;border-radius:13px;background:#2a2e41;font-weight:700}
.btn.main{background:var(--xp);color:#22130a}
.btn:disabled{opacity:.45;cursor:default}
.chest{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;border:1px solid var(--xp);background:#2a2115}
.chest.locked{border-color:var(--line);background:var(--panel)}
.chest div{flex:1}.chest b{display:block}.chest span{font-size:13px;color:var(--muted)}
nav{display:grid;grid-template-columns:repeat(4,1fr);padding:6px 10px calc(env(safe-area-inset-bottom) + 6px);border-top:1px solid var(--line);background:var(--panel)}
nav button{height:44px;border-radius:11px;color:var(--muted);font-weight:700}
nav button[aria-selected=true]{color:var(--text);background:#2a2e41}
form{display:flex;flex-direction:column;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
input,select,textarea{width:100%;min-height:46px;font-size:16px;background:#11131c;border:1px solid var(--line);border-radius:11px;padding:10px}
textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
p{margin:0;color:var(--muted);font-size:14px}
#toast{position:fixed;z-index:5;left:50%;top:calc(var(--top) + 12px);transform:translate(-50%,-140%);width:max-content;max-width:88vw;background:var(--text);color:#11131c;font-weight:700;padding:10px 15px;border-radius:13px;transition:transform .25s}
#toast.on{transform:translate(-50%,0)}
#rewind{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(var(--top) + 20px) 26px calc(env(safe-area-inset-bottom) + 20px);text-align:center;background:radial-gradient(circle at 50% 36%,#2b1747 0,#0b0812 48%,#000 100%);overflow-y:auto}
#rewind.on{display:flex;animation:rwIn .7s ease both}
#rewind svg{width:170px;height:170px;flex:none;filter:drop-shadow(0 0 22px #9a5cff)}
#rewind .hand{transform-origin:60px 60px;animation:rwSpin 1.1s linear 3 reverse}
#rewind .hand.b{animation-duration:.37s;animation-iteration-count:9}
#rwNum{font-size:58px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
#rwHead{font-size:22px;font-weight:800;margin:0}
#rewind p{color:#c9c0dc;font-size:15px;max-width:32ch}
#rewind ul{list-style:none;margin:0;padding:0;color:#e5dcff;font-weight:700}
#rwLate{display:flex;flex-direction:column;align-items:center;gap:12px;animation:rwLate .6s ease 3.3s both}
#rewind.wait *{animation-play-state:paused!important}#rewind.wait #rwLate{visibility:hidden}
#win{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(var(--top) + 16px) 18px calc(env(safe-area-inset-bottom) + 16px);background:rgba(5,5,9,.9)}
#win.on{display:flex}
#win img{display:block;max-width:100%;max-height:68vh;border-radius:20px;border:2px solid var(--xp);animation:pop .4s cubic-bezier(.2,1.5,.4,1) both}
#win b{font-size:22px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.slot{flex-wrap:wrap}.slot .btn{display:inline-grid;place-content:center;font-size:14px;min-height:40px;padding:0 12px}
.slot input{display:none}
#clear{position:fixed;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:rgba(7,8,20,.94)}
#clear.on{display:flex}#clear b{font-size:26px}#clear p{max-width:30ch}
main>*{flex:none}
.sky{display:block;width:100%;height:auto;border-radius:18px;border:1px solid var(--line)}
.card{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.card h3{margin:0;font-size:18px}.card .bar{margin:0}
.floorline{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}.floorline.now{color:var(--xp);font-weight:700}.floorline.ok{color:var(--good)}
#rwGo{background:#b98cff;color:#160b28;min-width:190px}
.trial{padding:13px;border-radius:14px;border:1px solid #9a5cff;background:#21172f}
.trial b{display:block}.trial span{font-size:13px;color:#c9c0dc}
@keyframes rwSpin{to{transform:rotate(360deg)}}
@keyframes rwIn{from{opacity:0;filter:brightness(4)}}
@keyframes rwLate{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}#rewind *,#rewind{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="top">
      <div class="lvl"><div><small>LEVEL</small><span id="level"></span></div></div>
      <div class="who"><b id="title"></b><span id="xpText"></span></div>
    </div>
    <div class="bar" role="progressbar" aria-label="XP to next level" aria-valuemin="0" aria-valuemax="100" id="barWrap"><i id="bar"></i></div>
    <div class="stats">
      <div class="stat"><b id="streak"></b><span>streak</span></div>
      <div class="stat"><b id="timelineN"></b><span>timeline</span></div>
      <div class="stat"><b id="shields"></b><span>shields</span></div>
      <div class="stat"><b id="coins"></b><span>coins</span></div>
    </div>
  </header>
  <main id="view"></main>
  <nav role="tablist">
    <button data-tab="today" role="tab">Today</button>
    <button data-tab="tower" role="tab">Tower</button>
    <button data-tab="rewards" role="tab">Rewards</button>
    <button data-tab="more" role="tab">Settings</button>
  </nav>
</div>
<div id="toast" role="status"></div>
<div id="clear" role="dialog" aria-modal="true" aria-labelledby="clearName"><small>FLOOR CLEARED</small><b id="clearName"></b><p id="clearText"></p><button class="btn main" id="clearGo">Keep climbing</button></div>
<div id="win" role="dialog" aria-modal="true" aria-label="All quests complete"><img id="winImg" alt="Your victory picture"><b>All quests complete!</b><button class="btn main" id="winGo">Close</button></div>
<div id="rewind" role="dialog" aria-modal="true" aria-labelledby="rwHead">
  <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="#0b0812" stroke="#b98cff" stroke-width="3"/><circle cx="60" cy="60" r="44" fill="none" stroke="#b98cff" stroke-width="5" stroke-dasharray="2 21.04"/><path d="M60 8 66 34 52 50 64 66 56 112" fill="none" stroke="#efe7ff" stroke-width="1.6"/><line class="hand" x1="60" y1="60" x2="60" y2="30" stroke="#efe7ff" stroke-width="5" stroke-linecap="round"/><line class="hand b" x1="60" y1="60" x2="60" y2="18" stroke="#b98cff" stroke-width="3" stroke-linecap="round"/></svg>
  <div id="rwNum"></div>
  <h2 id="rwHead" style="color:#fff"></h2>
  <div id="rwLate"><p id="rwText"></p><ul id="rwList"></ul><button class="btn" id="rwGo">Begin again</button></div>
</div>
<script>
const KEY='questlog.v1';
const DIFF={easy:{label:'Easy',xp:10,coins:5},medium:{label:'Medium',xp:25,coins:10},hard:{label:'Hard',xp:50,coins:20}};
const TITLES=['Rookie','Tidy Apprentice','Task Runner','Chore Slayer','Routine Knight','Habit Hero','Household Legend'];
const MAX_SHIELDS=3;
const RANKS=[{name:'Unlit',at:0,bonus:0},{name:'Spark',at:1,bonus:0},{name:'Ember',at:3,bonus:10},{name:'Flame',at:7,bonus:25},{name:'Blaze',at:14,bonus:50},{name:'Starfire',at:30,bonus:100}];
let tab='today',memory=null,storageOK=true;
const FLOORS=[
 {n:6,name:'Asterope',goal:10,unit:'quests',trial:'Climb out of the great basement. Complete 10 quests.',prize:{coins:50},prizeText:'50 coins'},
 {n:5,name:'Celaeno',goal:3,unit:'days',trial:'Finish every daily 3 days in a row. A Rewind resets this trial.',prize:{xp:60},prizeText:'60 XP'},
 {n:4,name:'Alcyone',goal:15,unit:'quests',trial:'Reach the safe floor. Complete 15 quests.',prize:{shield:1},prizeText:'a shield and the Green Room'},
 {n:3,name:'Taygeta',goal:12,unit:'stars',trial:'Star trial: light 12 stars. Hard quests light 2. Undoing a quest puts stars out.',prize:{coins:100},prizeText:'100 coins and the Library'},
 {n:2,name:'Electra',goal:300,unit:'damage',trial:'The Stick Duel: easy quests do nothing. Medium hits for 10, hard for 30, and your streak adds up to 10 more.',prize:{xp:150},prizeText:'150 XP'},
 {n:1,name:'The Summit',goal:7,unit:'days',trial:'The final trial: finish every daily on 7 days. A Rewind resets this trial.',prize:{coins:500,shield:1},prizeText:'500 coins, a shield and the title Keeper of the Watch'}];

const pad=n=>String(n).padStart(2,'0');
const dayStr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dayStr(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const gapDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dayStr(d)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fresh(){return{xp:0,coins:0,streak:0,best:0,shields:0,lastDone:null,chestOn:null,undo:null,
  tasks:[['Make the bed','easy'],['Wash the dishes','medium'],['Move for 20 minutes','hard']].map(([name,diff])=>({id:uid(),name,diff,repeat:'daily',doneOn:null})),
  rewards:[{id:uid(),name:'30 minutes of gaming',cost:100},{id:uid(),name:'Favorite snack',cost:150},{id:uid(),name:'Movie night',cost:400}]}}
function valid(s){return s&&typeof s==='object'&&Number.isFinite(s.xp)&&Number.isFinite(s.coins)&&Array.isArray(s.tasks)&&Array.isArray(s.rewards)}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(valid(s))return s}catch(e){}return fresh()}
function save(){memory=JSON.stringify(S);try{localStorage.setItem(KEY,memory);storageOK=true}catch(e){storageOK=false}}
let S=load();

function ensure(){S.tower=S.tower||{floor:0,p:0,insight:0,dayOn:null,green:null};S.loopLog=S.loopLog||[];
  if(S.timeline===undefined){S.timeline=S.streak||0;S.bestTimeline=S.streak||0;S.lastFull=S.lastDone||null;S.lastActive=S.lastDone||null;S.started=!!S.lastDone;S.lastRoll=today();S.undo=null;S.undoS=null}}
function climbGain(t){const T=S.tower,hard=t.diff==='hard';switch(T.floor){case 0:case 2:return 1;case 3:return (hard?2:1)+T.insight;case 4:{const b={medium:10,hard:30}[t.diff]||0;return b?b+Math.min(S.streak,10)+5*T.insight:0}default:return 0}}
function addClimb(n){const T=S.tower,F=FLOORS[T.floor];if(!F||n<=0)return;T.p+=n;if(T.p<F.goal)return;
  T.floor++;T.p=0;T.insight=0;const P=F.prize;S.coins+=P.coins||0;S.xp+=P.xp||0;if(P.shield)S.shields=Math.min(MAX_SHIELDS,S.shields+P.shield);
  clearName.textContent='Floor '+F.n+': '+F.name;clearText.textContent='You earned '+F.prizeText+'.';clear.classList.add('on');if(!playSound('floor')&&!playSound('scorpion'))blip(700)}
function towerFall(){const T=S.tower;if(T.floor<FLOORS.length&&[1,3,4,5].includes(T.floor)&&T.p>0){T.p=0;if(T.floor===3||T.floor===4)T.insight++}}
function levelInfo(xp){let level=1,left=xp,need=100;while(left>=need){left-=need;level++;need=100+(level-1)*25}return{level,into:left,need}}
function dailies(){return S.tasks.filter(t=>t.repeat==='daily')}
function allDone(){const d=dailies();return d.length>0&&d.every(t=>t.doneOn===today())}

function rankInfo(n){let i=0;RANKS.forEach((r,k)=>{if(n>=r.at)i=k});return{i,rank:RANKS[i],next:RANKS[i+1]}}
function rollover(){
  ensure();const t=today(),y=yesterday();
  S.tasks=S.tasks.filter(x=>x.repeat==='daily'||!x.doneOn||x.doneOn===t);
  if(S.lastRoll===t){save();return}
  if(S.undo&&S.undo.day!==t)S.undo=null;
  if(S.undoS&&S.undoS.day!==t)S.undoS=null;
  if(S.fallen&&S.fallen.day!==t){
    S.timeline=Math.floor(S.fallen.streak/7)*7;S.lastFull=S.timeline?y:null;S.fallen=null;
    toast(S.timeline?'Back to your '+S.timeline+'-day checkpoint':'A new timeline begins');
  }else if(S.started&&dailies().length&&S.lastFull!==y&&S.lastFull!==t){
    const missed=dailies().filter(x=>x.doneOn!==y).map(x=>x.name).slice(0,4);
    S.loops=(S.loops||0)+1;towerFall();
    S.loopLog.unshift({loop:S.loops,streak:S.timeline,day:t,missed});S.loopLog=S.loopLog.slice(0,30);
    S.fallen={streak:S.timeline,day:t,seen:false,missed};S.timeline=0;
  }
  if(S.lastActive&&S.streak>0){
    const gap=gapDays(S.lastActive,t)-1;
    if(gap>0){
      if(S.shields>=gap){S.shields-=gap;toast(gap===1?'A shield saved your streak':gap+' shields saved your streak')}
      else{const R=rankInfo(S.streak);S.streak=R.i>0?RANKS[R.i-1].at:0;toast(S.streak?'Your streak cooled to '+S.streak+' days':'Your streak went out')}
      S.lastActive=S.streak?y:null;
    }
  }
  S.lastRoll=t;save();
}
function settleDay(){
  const t=today();let finished=false;
  const active=S.tasks.some(x=>x.doneOn===t);
  if(active){S.started=true;if(S.lastActive!==t){
    S.undoS={day:t,streak:S.streak,shields:S.shields,lastActive:S.lastActive,best:S.best};
    const was=rankInfo(S.streak).i;S.streak++;S.best=Math.max(S.best||0,S.streak);S.lastActive=t;
    if(S.streak%7===0&&S.shields<MAX_SHIELDS)S.shields++;
    const R=rankInfo(S.streak);if(R.i>was)setTimeout(()=>toast(R.rank.name+' rank! +'+R.rank.bonus+'% XP'),900);
  }}else if(S.lastActive===t&&S.undoS&&S.undoS.day===t){
    Object.assign(S,{streak:S.undoS.streak,shields:S.undoS.shields,lastActive:S.undoS.lastActive,best:S.undoS.best});S.undoS=null;
  }
  if(allDone()&&S.lastFull!==t){
    S.undo={day:t,timeline:S.timeline,lastFull:S.lastFull,bestT:S.bestTimeline,fallen:S.fallen||null};
    const back=S.fallen&&S.fallen.day===t;finished=true;
    if([1,5].includes(S.tower.floor)&&S.tower.dayOn!==t){S.tower.dayOn=t;addClimb(1)}
    S.timeline=back?S.fallen.streak+1:S.timeline+1;S.fallen=null;S.bestTimeline=Math.max(S.bestTimeline||0,S.timeline);S.lastFull=t;
    toast(back?'Timeline restored: '+S.timeline+' days!':'All dailies done. Your chest is ready!');
  }else if(!allDone()&&S.lastFull===t&&S.undo&&S.undo.day===t){
    Object.assign(S,{timeline:S.undo.timeline,lastFull:S.undo.lastFull,bestTimeline:S.undo.bestT,fallen:S.undo.fallen});S.undo=null;
    if(S.tower.dayOn===t){S.tower.dayOn=null;S.tower.p=Math.max(0,S.tower.p-1)}
  }
  return finished;
}
function toggle(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const d=DIFF[t.diff]||DIFF.easy,before=levelInfo(S.xp).level;
  let adding=t.doneOn!==today();
  if(!adding){t.doneOn=null;S.xp=Math.max(0,S.xp-(t.gotXp||d.xp));S.coins=Math.max(0,S.coins-d.coins);if(S.tower.floor===3||S.tower.floor===4){const lost=climbGain(t);if(lost&&S.tower.p){S.tower.p=Math.max(0,S.tower.p-lost);toast('The scorpion saw that. -'+lost+' '+FLOORS[S.tower.floor].unit)}}}
  else{const gain=Math.round(d.xp*(1+rankInfo(S.streak).rank.bonus/100));t.gotXp=gain;t.doneOn=today();S.xp+=gain;S.coins+=d.coins;toast('+'+gain+' XP, +'+d.coins+' coins');if(t.climbed!==today()){t.climbed=today();addClimb(climbGain(t))}}
  const finished=settleDay();
  if(finished)celebrate();else if(adding&&!playSound('rbd'))blip(520);
  const after=levelInfo(S.xp).level;
  if(after>before){blip(780);toast('Level up! You reached level '+after)}
  commit();
}
function openChest(){
  if(!allDone()||S.chestOn===today())return;
  S.chestOn=today();
  const r=Math.random();let msg;
  if(r<.1&&S.shields<MAX_SHIELDS){S.shields++;msg='Rare find: a streak shield!'}
  else if(r<.4){const n=25+Math.floor(Math.random()*26);S.xp+=n;msg='Chest: +'+n+' XP'}
  else{const n=20+Math.floor(Math.random()*31);S.coins+=n;msg='Chest: +'+n+' coins'}
  blip(660);toast(msg);commit();
}
function commit(){save();render()}
let audio;
const SLOTS=[['rbd','Quest complete sound','audio'],['scorpion','All quests complete sound','audio'],['call1','Rewind sound 1','audio'],['call2','Rewind sound 2','audio'],['floor','Tower floor cleared sound','audio'],['popup','All quests complete picture','image']];
const media={},buffers={};let current,winUrl,dbP;
function ctx(){audio=audio||new(window.AudioContext||window.webkitAudioContext)();return audio}
function blip(f){try{const c=ctx();c.resume();const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.16)}catch(e){}}
function playSound(key){const b=buffers[key];if(!b)return false;try{const c=ctx();c.resume();if(current)try{current.stop()}catch(e){}current=c.createBufferSource();current.buffer=b;current.connect(c.destination);current.start();return true}catch(e){return false}}
function db(){return dbP=dbP||new Promise((ok,no)=>{const r=indexedDB.open('questlog-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function store(mode,fn){const d=await db();return new Promise((ok,no)=>{const t=d.transaction('files',mode),r=fn(t.objectStore('files'));t.oncomplete=()=>ok(r.result);t.onerror=t.onabort=()=>no(t.error)})}
async function prepare(key,blob){media[key]=blob;delete buffers[key];if(key!=='popup'){const data=await blob.arrayBuffer();buffers[key]=await new Promise((ok,no)=>ctx().decodeAudioData(data,ok,no))}}
async function loadMedia(){try{const keys=await store('readonly',o=>o.getAllKeys());for(const k of keys){const b=await store('readonly',o=>o.get(k));try{await prepare(k,b)}catch(e){}}if(tab==='more')render()}catch(e){}}
async function addMedia(key,file){try{await prepare(key,file);await store('readwrite',o=>o.put(file,key));try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}toast('Added');render()}catch(e){delete media[key];delete buffers[key];toast('That file would not load. Try an MP3 or GIF.');render()}}
async function removeMedia(key){delete media[key];delete buffers[key];try{await store('readwrite',o=>o.delete(key))}catch(e){}render()}
function showWin(){if(!media.popup)return;if(winUrl)URL.revokeObjectURL(winUrl);winUrl=URL.createObjectURL(media.popup);winImg.src=winUrl;win.classList.add('on')}
function celebrate(){if(!playSound('scorpion'))blip(780);showWin()}
let toastTimer;
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),2200)}

function taskRow(t){
  const d=DIFF[t.diff]||DIFF.easy,done=t.doneOn===today();
  return `<div class="row ${done?'done':''}"><button class="check" data-toggle="${esc(t.id)}" aria-label="${done?'Undo':'Complete'} ${esc(t.name)}">${done?'✓':''}</button>
  <button class="info" data-toggle="${esc(t.id)}"><span class="name">${esc(t.name)}</span><span class="meta">${d.label} · ${d.xp} XP · ${d.coins} coins</span></button>
  <button class="x" data-del-task="${esc(t.id)}" aria-label="Delete ${esc(t.name)}">×</button></div>`}
function viewToday(){
  const ds=dailies(),once=S.tasks.filter(t=>t.repeat!=='daily'),n=ds.filter(t=>t.doneOn===today()).length,opened=S.chestOn===today(),ready=allDone()&&!opened;
  const trial=S.fallen?`<div class="trial"><b>Second chance: loop ${S.loops||1}</b><span>Finish every daily today to restore your ${S.fallen.streak}-day timeline.</span></div>`:'';
  const R=rankInfo(S.streak),rankCard=`<div class="chest locked"><div><b>${R.rank.name} streak${R.rank.bonus?': +'+R.rank.bonus+'% XP':''}</b><span>${R.next?(R.next.at-S.streak)+' more active '+(R.next.at-S.streak===1?'day':'days')+' to '+R.next.name+' (+'+R.next.bonus+'% XP)':'Highest rank reached'}. One quest a day keeps it lit.</span></div></div>`;
  return `${trial}${rankCard}<div class="chest ${ready?'':'locked'}"><div><b>Daily chest</b><span>${opened?'Opened. A new one comes tomorrow.':ready?'Ready to open':`${n} of ${ds.length} dailies done`}</span></div><button class="btn ${ready?'main':''}" id="chest" ${ready?'':'disabled'}>Open</button></div>
  <h2>Daily quests</h2>${ds.map(taskRow).join('')||'<p>Add a daily quest to start your streak.</p>'}
  ${once.length?'<h2>One-time quests</h2>'+once.map(taskRow).join(''):''}
  <h2>Add a quest</h2><form id="addTask"><input id="taskName" maxlength="80" required placeholder="Take out the trash" aria-label="Quest name">
  <div class="two"><select id="taskDiff" aria-label="Difficulty"><option value="easy">Easy, 10 XP</option><option value="medium">Medium, 25 XP</option><option value="hard">Hard, 50 XP</option></select>
  <select id="taskRepeat" aria-label="Repeat"><option value="daily">Every day</option><option value="once">One time</option></select></div><button class="btn main">Add quest</button></form>`}
function towerArt(){
  const fl=S.tower.floor,R=i=>{const x=Math.sin(i*91.7)*43758.5;return x-Math.floor(x)};
  let o='<svg class="sky" viewBox="0 0 360 340" role="img" aria-label="Tower progress: '+fl+' of 6 floors cleared"><defs><linearGradient id="n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090c22"/><stop offset=".75" stop-color="#27264f"/><stop offset="1" stop-color="#a8704a"/></linearGradient></defs><rect width="360" height="340" fill="url(#n)"/>';
  for(let i=0;i<70;i++)o+=`<circle cx="${(R(i)*360).toFixed(1)}" cy="${(R(i+200)*235).toFixed(1)}" r="${(.5+R(i+400)*1.1).toFixed(1)}" fill="#fff" opacity="${(.35+R(i+600)*.6).toFixed(2)}"/>`;
  [[52,34],[70,52],[42,66],[88,28],[104,62],[76,84],[30,40]].forEach(([x,y],i)=>o+=`<circle cx="${x}" cy="${y}" r="2.6" fill="${i<fl?'#ffb53d':'#596080'}"/>`);
  for(let i=0;i<6;i++){const y=270-i*38,b=64-i*7,t=b-6,on=i<fl,now=i===fl;
    o+=`<path d="M${180-b} ${y}L${180-t} ${y-34}H${180+t}L${180+b} ${y}Z" fill="${on?'#d9c49b':now?'#8d86a8':'#3a3b5a'}" stroke="#14152b"/><rect x="${180-b-3}" y="${y-3}" width="${2*b+6}" height="5" fill="${on?'#ffb53d':'#25264a'}"/>`;
    for(let w=-1;w<=1;w++)o+=`<rect x="${180+w*t*.55-3}" y="${y-25}" width="6" height="13" rx="3" fill="${on||now?'#ffdf98':'#1c1d38'}"/>`}
  o+='<path d="M180 16 196 44H164Z" fill="'+(fl>=6?'#ffb53d':'#3a3b5a')+'" stroke="#14152b"/>';
  o+='<path d="M0 292C70 262 120 302 190 282S300 262 360 288V340H0Z" fill="#c08a58"/><path d="M0 320C80 292 170 332 250 306S330 300 360 312V340H0Z" fill="#8f5f41"/>';
  if(fl<6){const y=255-fl*38;o+=`<path d="M${248-fl*7} ${y-9}l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#ffb53d"/>`}
  return o+'</svg>'}
function starTrial(p){const pts=[[30,50],[62,24],[96,44],[132,18],[166,48],[202,26],[238,52],[270,28],[238,84],[190,92],[132,84],[76,90]];let o='<svg viewBox="0 0 300 110" role="img" aria-label="'+p+' of 12 stars lit" style="width:100%">';pts.forEach((a,i)=>{const b=pts[i+1];if(b)o+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${i+1<p?'#ffb53d':'#2d3144'}" stroke-width="2"/>`});pts.forEach((a,i)=>o+=`<circle cx="${a[0]}" cy="${a[1]}" r="6" fill="${i<p?'#ffb53d':'#2d3144'}"/>`);return o+'</svg>'}
function viewTower(){
  const T=S.tower,F=FLOORS[T.floor];
  const card=F?`<div class="card"><small>FLOOR ${F.n}</small><h3>${F.name}</h3><p>${F.trial}</p>${T.floor===3?starTrial(T.p):''}<div class="bar"><i style="width:${Math.round(T.p/F.goal*100)}%"></i></div><div class="floorline"><span>${T.p} / ${F.goal} ${F.unit}</span><span>Reward: ${F.prizeText}</span></div>${T.insight?`<p>Memory from past loops: +${T.floor===4?5*T.insight+' damage':T.insight+' stars'} per quest.</p>`:''}</div>`:'<div class="card"><small>TOWER CLEARED</small><h3>Keeper of the Watch</h3><p>You stand at the top. The stars are yours.</p></div>';
  const green=T.floor>2?`<div class="chest ${T.green===today()?'locked':''}"><div><b>Green Room</b><span>${T.green===today()?'Rested. Come back tomorrow.':'Rest for 10 XP and 5 coins.'}</span></div><button class="btn ${T.green===today()?'':'main'}" id="rest" ${T.green===today()?'disabled':''}>Rest</button></div>`:'';
  const lib=T.floor>3?'<h2>Library of past loops</h2>'+(S.loopLog.map(l=>`<div class="row"><div class="info"><span class="name">Loop ${l.loop}: ${l.streak}-day timeline</span><span class="meta">${esc(l.day)}${l.missed&&l.missed.length?' · Fell to: '+l.missed.map(esc).join(', '):''}</span></div></div>`).join('')||'<p>No books yet. Your timelines are still intact.</p>'):'';
  return towerArt()+`<p>The scorpion at the gate is watching your climb.</p>`+card+green+lib+'<h2>Floors</h2><div class="card">'+FLOORS.map((f,i)=>`<div class="floorline ${i<T.floor?'ok':i===T.floor?'now':''}"><span>${f.n}. ${f.name}</span><span>${i<T.floor?'Cleared':i===T.floor?'Climbing':'Locked'}</span></div>`).reverse().join('')+'</div>'}
function viewRewards(){
  return `<p>Spend coins on real-life treats you choose.</p>${S.rewards.map(r=>`<div class="row"><div class="info"><span class="name">${esc(r.name)}</span><span class="meta">${r.cost} coins</span></div><button class="btn ${S.coins>=r.cost?'main':''}" data-buy="${esc(r.id)}" ${S.coins>=r.cost?'':'disabled'}>Redeem</button><button class="x" data-del-reward="${esc(r.id)}" aria-label="Delete ${esc(r.name)}">×</button></div>`).join('')}
  <h2>Add a reward</h2><form id="addReward"><input id="rewardName" maxlength="80" required placeholder="Coffee out" aria-label="Reward name"><input id="rewardCost" type="number" inputmode="numeric" min="1" max="100000" required placeholder="Cost in coins" aria-label="Cost in coins"><button class="btn main">Add reward</button></form>`}
function viewMore(){
  return `<h2>Your sounds and picture</h2><p>These stay private on this device and are not included in backup codes. Add them from the installed app.</p>
  ${SLOTS.map(([k,n,type])=>`<div class="row slot"><div class="info"><span class="name">${n}</span><span class="meta">${media[k]?'Added':'Not added'}</span></div>${media[k]?`<button class="btn" data-test="${k}">Test</button><button class="btn" data-remove="${k}">Remove</button>`:`<label class="btn main">Choose<input type="file" data-slot="${k}" accept="${type==='audio'?'audio/*,.mp3,.m4a':'image/*,.gif'}"></label>`}</div>`).join('')}
  <h2>Back up your progress</h2><p>Your progress lives only on this device. Copy this code now and then, and keep it in Notes.</p>
  <button class="btn main" id="copy">Copy backup code</button><textarea id="out" readonly aria-label="Backup code">${esc(JSON.stringify(S))}</textarea>
  <h2>Restore a backup</h2><p>This replaces everything currently in the app.</p><textarea id="in" placeholder="Paste a backup code" aria-label="Paste a backup code"></textarea><button class="btn" id="restore">Restore backup</button>
  <h2>Stats</h2><p>Best streak: ${S.best||0} days · Best timeline: ${S.bestTimeline||0} days · Total XP: ${S.xp} · Loops: ${S.loops||0}</p><button class="btn" id="preview">Preview the rewind</button>${storageOK?'':'<p>This browser is blocking saved data, so copy a backup before closing.</p>'}`}
function render(){
  const L=levelInfo(S.xp),pct=Math.round(L.into/L.need*100);
  level.textContent=L.level;title.textContent=TITLES[Math.min(Math.floor((L.level-1)/3),TITLES.length-1)];
  xpText.textContent=L.into+' / '+L.need+' XP to level '+(L.level+1);bar.style.width=pct+'%';barWrap.setAttribute('aria-valuenow',pct);
  streak.textContent=S.streak;timelineN.textContent=S.timeline;shields.textContent=S.shields+'/'+MAX_SHIELDS;coins.textContent=S.coins;
  const top=view.scrollTop;view.innerHTML=tab==='today'?viewToday():tab==='tower'?viewTower():tab==='rewards'?viewRewards():viewMore();view.scrollTop=top;
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
}
document.querySelector('nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;view.scrollTop=0;render()}};
view.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;const D=b.dataset;
  if(D.toggle)toggle(D.toggle);
  else if(D.delTask){S.tasks=S.tasks.filter(t=>t.id!==D.delTask);settleDay();commit()}
  else if(D.delReward){S.rewards=S.rewards.filter(r=>r.id!==D.delReward);commit()}
  else if(D.buy){const r=S.rewards.find(x=>x.id===D.buy);if(r&&S.coins>=r.cost){S.coins-=r.cost;blip(700);toast('Enjoy: '+r.name);commit()}}
  else if(D.test){if(D.test==='popup')showWin();else playSound(D.test)}
  else if(D.remove)removeMedia(D.remove);
  else if(b.id==='rest'&&S.tower.green!==today()){S.tower.green=today();S.xp+=10;S.coins+=5;toast('+10 XP, +5 coins');commit()}
  else if(b.id==='chest')openChest();
  else if(b.id==='preview')showRewind({streak:Math.max(S.timeline,12),missed:dailies().slice(0,3).map(t=>t.name)},true);
  else if(b.id==='copy'){const o=document.getElementById('out');try{await navigator.clipboard.writeText(o.value);toast('Backup copied')}catch(err){o.focus();o.select();toast('Select the code and copy it')}}
  else if(b.id==='restore'){try{const s=JSON.parse(document.getElementById('in').value);if(!valid(s))throw 0;S=s;rollover();tab='today';render();toast('Backup restored')}catch(err){toast('That code did not work. Paste the whole backup.')}}
});
view.addEventListener('change',e=>{const k=e.target.dataset.slot,f=e.target.files&&e.target.files[0];if(k&&f)addMedia(k,f)});
clearGo.onclick=()=>clear.classList.remove('on');
winGo.onclick=()=>win.classList.remove('on');
document.addEventListener('pointerdown',()=>{try{if(audio)audio.resume()}catch(e){}},{passive:true});
view.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='addTask'){const name=taskName.value.trim();if(name){S.tasks.push({id:uid(),name,diff:taskDiff.value,repeat:taskRepeat.value,doneOn:null});settleDay();commit()}}
  if(e.target.id==='addReward'){const name=rewardName.value.trim(),cost=Math.floor(+rewardCost.value);if(name&&cost>0){S.rewards.push({id:uid(),name,cost});commit()}}
});
function showRewind(f,demo){
  const el=document.getElementById('rewind'),n=document.getElementById('rwNum');
  rwHead.textContent='Your timeline ended';
  rwText.textContent=demo?'This is a preview. Your progress has not changed.':'You came back with your memory. You missed a daily quest. Finish every daily today to restore your '+f.streak+'-day timeline. Fail, and you return to your last 7-day checkpoint.';
  rwList.innerHTML=(f.missed||[]).map(m=>'<li>'+esc(m)+'</li>').join('');
  const calls=['call1','call2'].filter(k=>buffers[k]);
  const head=rwHead.textContent;
  const begin=()=>{
    el.classList.remove('wait');rwHead.textContent=head;
    if(calls.length)playSound(calls[Math.floor(Math.random()*calls.length)]);
    else [440,330,247,165].forEach((h,i)=>setTimeout(()=>blip(h),i*420));
    let v=f.streak;n.textContent=v;clearInterval(showRewind.t);
    const step=Math.max(1,Math.ceil(f.streak/24));
    showRewind.t=setInterval(()=>{v=Math.max(0,v-step);n.textContent=v;if(!v)clearInterval(showRewind.t)},2800/Math.ceil(f.streak/step));
  };
  el.classList.remove('on','wait');void el.offsetWidth;el.classList.add('on');n.textContent=f.streak;
  if(demo)begin();else{el.classList.add('wait');rwHead.textContent='Tap to return';el.addEventListener('pointerdown',begin,{once:true})}
  rwGo.onclick=()=>{el.classList.remove('on');if(!demo&&S.fallen){S.fallen.seen=true;commit()}};
  }
function maybeRewind(){if(S.fallen&&!S.fallen.seen)showRewind(S.fallen)}
let seen=today();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&seen!==today()){seen=today();rollover();render();maybeRewind()}});
rollover();render();loadMedia().then(maybeRewind);
if('serviceWorker'in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
</body>
